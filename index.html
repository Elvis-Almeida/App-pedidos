<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Impede zoom e double-tap zoom no iOS -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- PWA / iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="SCJ Pedidos" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="manifest" href="./manifest.json" />
    <title>SCJ - Pedidos</title>

    <style>
      /* Impede double-tap zoom e scroll indesejado globalmente no iOS */
      html {
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="historico">
      <div id="textoHistorico"></div>
      <div id="botoesHistorico">
        <div class="botoes2" id="botaoFecharHistorico">Fechar</div>
        <a id="botaoDownload"
          ><div class="botoes2" id="botaoBaixarHistorico">Baixar</div></a
        >
      </div>
    </div>

    <div id="caixaDeConfirmacaoDeSalvamento">
      <p id="textoDeConfirmacao">Tem certeza que deseja salvar?</p>
      <div class="botoes2 botoesconfirmacao" id="caixaDeConfirmacao">Sim</div>
      <div class="botoes2 botoesconfirmacao" id="caixaDeConfirmacaoFechar">
        Não
      </div>
    </div>

    <div id="telaFinalizarPedido">
      <!-- Cabeçalho -->
      <div id="headerFinalizarPedido">
        <h2>Resumo do Pedido</h2>
        <span id="contadorItens">0 itens</span>
      </div>

      <!-- Lista de itens -->
      <div id="telaFinalizarPedidoTexto"></div>

      <!-- Total -->
      <div id="blocoTotal">
        <span id="labelTotal">Total</span>
        <span id="caixaTotal">R$ 0,00</span>
      </div>

      <!-- Input valor pago -->
      <div id="areapagamento">
        <div id="labelPago">Valor recebido</div>
        <input
          placeholder="R$ 0,00"
          type="tel"
          name="inputPago"
          id="inputPago"
          inputmode="numeric"
        />
      </div>

      <!-- Troco -->
      <div id="blocoTroco">
        <span id="labelTroco">Troco</span>
        <span id="caixaTroco">R$ 0,00</span>
      </div>

      <!-- Botões -->
      <div id="caixaBotoes">
        <div class="botoes2" id="botaoFechar">Fechar</div>
        <div class="botoes2" id="botaoCalcular">✓ Salvar pedido</div>
      </div>
    </div>

    <div id="caixaDeTexto">
      <p></p>
      <div id="caixaDePreco">R$ 0,00</div>
    </div>

    <div id="botoesDeControle">
      <div class="botoes" id="resetar">Resetar</div>
      <div class="botoes" id="finalizarPedido">Finalizar</div>
      <div class="botoes" id="apagar">Apagar</div>
    </div>

    <div id="container"></div>

    <script src="./script/script.js"></script>
  </body>
</html>
